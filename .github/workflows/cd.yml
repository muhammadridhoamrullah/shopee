name: CD - Build and Push Docker Image (Next.js)

on:
  push:
    branches: [main]
    paths:
      - "nextjs-shopee/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nextjs-shopee

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./nextjs-shopee
          file: ./nextjs-shopee/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_MIDTRANS_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy ke EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            TAG="${{ github.sha }}"

            # 1. Login pakai token sementara milik runner
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Pull image terbaru dari GitHub Container Registry
            docker pull "$IMAGE:$TAG"

            # 3. Stop dan hapus container lama
            docker stop shopee-nextjs || true
            docker rm shopee-nextjs || true

            # 4. Jalankan container baru dengan image terbaru

            docker run -d --name shopee-nextjs --restart unless-stopped -m 350m --memory-swap 700m -p 3001:3000 --env-file /home/ubuntu/.env.production "$IMAGE:$TAG"

            # 5. Bersihkan image lama yang tidak digunakan lagi

            docker logout ghcr.io
            docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.ID}}' | grep -v "$TAG" | xargs -r docker rmi -f || true
